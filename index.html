<!DOCTYPE html>
<html lang="en" style="background-color: #0a0e1a;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <script>
        // Apply theme background IMMEDIATELY - before any rendering
        (function() {
            var themeColors = { driveline: "#0a0a0a", hopkins: "#0a0e1a", mets: "#0a1428", phillies: "#120a0c" };
            var theme = localStorage.getItem("theme") || "hopkins";
            var color = themeColors[theme] || themeColors.hopkins;
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.backgroundColor = color;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", color);
        })();
    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-35RY8Y6Q5V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-35RY8Y6Q5V');
    </script>
    <meta name="description" content="Professional pitcher and R&D analyst. Former Mets and Phillies organizations. Currently at Driveline Baseball.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hedgertronic.github.io/">
    <meta property="og:title" content="Josh Hejka">
    <meta property="og:description" content="Professional pitcher and R&D analyst. Former Mets and Phillies organizations. Currently at Driveline Baseball.">
    <meta property="og:image" content="https://hedgertronic.github.io/assets/images/og/og-image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@hedgertronic">
    <meta name="twitter:title" content="Josh Hejka">
    <meta name="twitter:description" content="Professional pitcher and R&D analyst. Former Mets and Phillies organizations. Currently at Driveline Baseball.">
    <meta name="twitter:image" content="https://hedgertronic.github.io/assets/images/og/og-image.png">

    <title>Josh Hejka</title>
    <link rel="icon" href="/assets/images/favicons/favicon.ico?v=12" sizes="32x32">
    <link rel="icon" type="image/png" href="/assets/images/favicons/favicon-16.png?v=12" sizes="16x16">
    <link rel="icon" type="image/png" href="/assets/images/favicons/favicon-32.png?v=12" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/images/favicons/apple-touch-icon.png?v=12">
    <link rel="stylesheet" href="/styles.css">
    <script>
        // Preload theme-specific headshot for faster LCP
        (function() {
            var themeHeadshots = {
                driveline: "/assets/images/headshot/headshot-dl-sm.jpg",
                hopkins: "/assets/images/headshot/headshot-dl-sm.jpg",
                mets: "/assets/images/headshot/headshot-mets-sm.jpg",
                phillies: "/assets/images/headshot/headshot-phillies-sm.jpg"
            };
            var theme = localStorage.getItem("theme") || "hopkins";
            var headshot = themeHeadshots[theme] || themeHeadshots.hopkins;
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.href = headshot;
            link.fetchPriority = "high";
            document.head.appendChild(link);
            // Store headshot path for use after body loads
            window.__themeHeadshot = headshot;
        })();
    </script>
</head>
<body id="top">
    <div class="page-background"></div>
    <div class="grid-overlay"></div>
    <header></header>
    <main>
        <section id="about" class="hero">
            <div class="container">
                <div class="hero-intro">
                    <!-- Hero image in HTML for faster LCP - JS will enhance this -->
                    <img id="hero-headshot-img"
                         src="/assets/images/headshot/headshot-dl-sm.jpg"
                         alt="Josh Hejka"
                         class="hero-headshot"
                         width="100"
                         height="100"
                         fetchpriority="high">
                    <script>
                        // Update headshot src immediately after element exists
                        if (window.__themeHeadshot) {
                            document.getElementById("hero-headshot-img").src = window.__themeHeadshot;
                        }
                    </script>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>
    <script defer src="/script.js"></script>
</body>
</html>
