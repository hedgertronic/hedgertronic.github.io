<html lang="en" data-theme="marlins">
<head>

<style>
  @font-face {
    font-family: 'DM Sans';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('/assets/fonts/DMSans.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400 500;
    font-display: swap;
    src: url('/assets/fonts/JetBrainsMono.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/assets/fonts/InstrumentSerif.woff2') format('woff2');
  }

  :root {
    --bg-primary: #0a1317;
    --bg-secondary: #0e191d;
    --bg-card: #152328;
    --accent-primary: #f85a4d;
    --accent-secondary: #00a3e0;
    --text-primary: #e0fff8;
    --text-secondary: #68c8b0;
    --text-muted: #4a8474;
    --border-color: #1a3d35;
    --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-display: 'Instrument Serif', Georgia, serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
  }
  /* Full per-theme tokens, mirrored from styles.css so the 404 matches the
     visitor's stored theme exactly. Keep in sync if a theme changes. */
  [data-theme="driveline"] {
    --bg-primary: #0a0a0a; --bg-secondary: #111111; --bg-card: #1a1a1a;
    --accent-primary: #FFA300; --accent-secondary: #cc8200;
    --text-primary: #ffffff; --text-secondary: #b0b0b0; --border-color: #333333;
  }
  [data-theme="hopkins"] {
    --bg-primary: #0a0f17; --bg-secondary: #0e141d; --bg-card: #151d28;
    --accent-primary: #68ace5; --accent-secondary: #002d72;
    --text-primary: #e8f4ff; --text-secondary: #a0c4e8; --border-color: #2a3f5f;
  }
  [data-theme="mets"] {
    --bg-primary: #0a1222; --bg-secondary: #0e172a; --bg-card: #141f36;
    --accent-primary: #ff5910; --accent-secondary: #002d72;
    --text-primary: #e8f0ff; --text-secondary: #8ba8d9; --border-color: #2a3d5f;
  }
  [data-theme="phillies"] {
    --bg-primary: #170a0c; --bg-secondary: #1d0e10; --bg-card: #281518;
    --accent-primary: #5b8ad8; --accent-secondary: #e81828;
    --text-primary: #ffeef0; --text-secondary: #d8a0a8; --border-color: #4a2a35;
  }
  [data-theme="rangers"] {
    --bg-primary: #0a1017; --bg-secondary: #0e151d; --bg-card: #151e28;
    --accent-primary: #e94f5c; --accent-secondary: #003278;
    --text-primary: #e0ecff; --text-secondary: #8ab0d4; --border-color: #253560;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    line-height: 1.5;
  }

  main {
    width: 100%;
    max-width: 34rem;
    text-align: center;
  }

  .wordmark {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 2.5rem;
  }
  .wordmark a {
    color: inherit;
    text-decoration: none;
    border-radius: var(--radius-sm);
    padding: 0.25rem 0.4rem;
  }
  .wordmark a:hover { color: var(--text-primary); }
  /* re-center: tracking adds a phantom space after the last letter */
  .wordmark { text-indent: 0.28em; }

  /* Scoreboard: the count 4-0-4 does not exist */
  .scoreboard {
    display: inline-grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 2.5rem;
  }

  .digit-cell {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 0.75rem 0.5rem;
    min-width: 5.25rem;
  }

  /* Bulb-board digits: 5x7 grids of lamps, drawn inline so they inherit
     each theme's accent and need no extra font file */
  .digit-svg {
    display: block;
    width: clamp(2.9rem, 13vw, 4.4rem);
    height: auto;
    margin: 0 auto;
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent-primary) 35%, transparent));
  }
  .digit-svg .on  { fill: var(--accent-primary); }
  .digit-svg .off { fill: var(--text-primary); opacity: 0.05; }

  .digit-cell .label {
    display: block;
    margin-top: 0.75rem; /* equal to cell bottom padding: label centers in its band */
    font-family: var(--font-mono);
    font-size: 0.625rem;
    letter-spacing: 0.22em;
    /* re-center: tracking adds a phantom space after the last letter */
    text-indent: 0.22em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  /* The one animated touch: a single dying bulb on the zero */
  .digit-svg .flick { animation: bulb 6s infinite step-end; }
  @keyframes bulb {
    0%, 41%, 43.5%, 78%, 79.5%, 100% { opacity: 1; }
    42%, 78.6% { opacity: 0.35; }
    43%, 79% { opacity: 0.7; }
  }
  @media (prefers-reduced-motion: reduce) {
    .digit-svg .flick { animation: none; }
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.6rem, 5.5vw, 2.15rem);
    letter-spacing: 0.01em;
    margin-bottom: 0.75rem;
  }

  .sub {
    color: var(--text-secondary);
    font-size: 1rem;
    max-width: 26rem;
    margin: 0 auto 2.25rem;
  }

  .home-link {
    display: inline-block;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--bg-primary);
    background: var(--accent-primary);
    text-decoration: none;
    padding: 0.8rem 1.6rem;
    border-radius: var(--radius-md);
    transition: transform 120ms ease, filter 120ms ease;
  }
  .home-link:hover { filter: brightness(1.08); }
  .home-link:active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) {
    .home-link { transition: none; }
  }

  /* accent-primary, not accent-secondary: several themes' secondary is a
     dark navy that would vanish against the page background */
  :is(.home-link, .wordmark a):focus-visible {
    outline: 2px solid var(--accent-primary);
    outline-offset: 3px;
  }

  @media (max-width: 380px) {
    .scoreboard { gap: 0.5rem; }
    .digit-cell { min-width: 0; padding: 0.6rem 0.35rem; }
    .digit-cell .label { margin-top: 0.6rem; }
  }
</style>
</head>
