<!DOCTYPE html>
<html lang="en" style="background-color: #0a1317;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a1317">
    <script>
        // Single source of truth for theme configuration (matches homepage)
        window.__themeConfig = {
            colors: { driveline: "#0a0a0a", hopkins: "#0a0f17", mets: "#0a1222", phillies: "#170a0c", rangers: "#0a1017", marlins: "#0a1317" },
            headshots: {
                driveline: "/assets/images/headshot/headshot-dl-sm.jpg",
                hopkins: "/assets/images/headshot/headshot-dl-sm.jpg",
                mets: "/assets/images/headshot/headshot-mets-sm.jpg",
                phillies: "/assets/images/headshot/headshot-phillies-sm.jpg",
                rangers: "/assets/images/headshot/headshot-dl-sm.jpg",
                marlins: "/assets/images/headshot/headshot-dl-sm.jpg"
            }
        };
        // Apply theme background IMMEDIATELY - before any rendering
        (function() {
            var cfg = window.__themeConfig;
            var theme = localStorage.getItem("theme") || "marlins";
            var color = cfg.colors[theme] || cfg.colors.marlins;
            window.__currentTheme = theme;
            window.__currentColor = color;
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.backgroundColor = color;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", color);
            // Handle Safari bfcache restoration (use the live theme color, not the load-time one)
            window.addEventListener("pageshow", function(e) {
                if (e.persisted) {
                    document.documentElement.style.backgroundColor = window.__currentColor || color;
                }
            });
        })();
    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-35RY8Y6Q5V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-35RY8Y6Q5V');
    </script>
    <meta name="description" content="My Throwing Evolution - Tracking pitch development and training progress.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hedgertronic.com/evolution">
    <meta property="og:title" content="Evolution - Josh Hejka">
    <meta property="og:description" content="My Throwing Evolution - Tracking pitch development and training progress.">
    <meta property="og:image" content="https://hedgertronic.com/assets/images/og/og-image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@hedgertronic">
    <meta name="twitter:title" content="Evolution - Josh Hejka">
    <meta name="twitter:description" content="My Throwing Evolution - Tracking pitch development and training progress.">
    <meta name="twitter:image" content="https://hedgertronic.com/assets/images/og/og-image.png">

    <title>Evolution - Josh Hejka</title>
    <link rel="icon" href="/assets/images/favicons/favicon.ico?v=12" sizes="32x32">
    <link rel="icon" type="image/png" href="/assets/images/favicons/favicon-16.png?v=12" sizes="16x16">
    <link rel="icon" type="image/png" href="/assets/images/favicons/favicon-32.png?v=12" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/images/favicons/apple-touch-icon.png?v=12">
    <style>
        /* Critical CSS: prevent background flash before external CSS loads.
           The page background lives on html/body (not a fixed overlay) so iOS
           26 Safari can sample it for Liquid Glass toolbar tint and extend it
           into the toolbar and overscroll areas. */
        html, body { background-color: #0a1317; }
        [data-theme="driveline"], [data-theme="driveline"] body { background-color: #0a0a0a; }
        [data-theme="mets"], [data-theme="mets"] body { background-color: #0a1222; }
        [data-theme="phillies"], [data-theme="phillies"] body { background-color: #170a0c; }
        [data-theme="rangers"], [data-theme="rangers"] body { background-color: #0a1017; }
        [data-theme="hopkins"], [data-theme="hopkins"] body { background-color: #0a0f17; }
    </style>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/css/resume.css">
    <link rel="stylesheet" href="/css/evolution.css">
</head>
<body class="evolution-page" style="background-color: #0a1317;">
    <script>
        // Immediately apply theme background to body (uses cached value from head)
        document.body.style.backgroundColor = window.__currentColor || "#0a1317";
    </script>
    <header>
        <nav class="container">
            <a href="/" class="logo">
                <span class="back-arrow">&larr;</span>
                <img id="logo-headshot" src="/assets/images/headshot/headshot-dl-sm.jpg" alt="Josh Hejka" class="logo-headshot">
                <script>
                    (function() {
                        var cfg = window.__themeConfig;
                        var theme = window.__currentTheme || "marlins";
                        var img = document.getElementById("logo-headshot");
                        if (img && cfg && cfg.headshots[theme]) {
                            img.src = cfg.headshots[theme];
                        }
                    })();
                </script>
                <span class="logo-text">Josh Hejka</span>
            </a>
            <a href="#evolution-hero" id="nav-page-title" class="nav-page-title"></a>
        </nav>
    </header>
    <main>
        <section id="evolution-hero" class="hero evolution-hero-section">
            <div class="container">
                <div class="hero-intro">
                    <!-- Static content pre-rendered for instant display, zero layout shift -->
                    <img id="hero-headshot-img"
                         src="/assets/images/headshot/headshot-dl-sm.jpg"
                         alt="Josh Hejka"
                         class="hero-headshot"
                         width="100"
                         height="100"
                         fetchpriority="high">
                    <script>
                        // Update headshot src immediately after element exists
                        if (window.__themeConfig && window.__currentTheme) {
                            var headshot = window.__themeConfig.headshots[window.__currentTheme];
                            if (headshot) document.getElementById("hero-headshot-img").src = headshot;
                        }
                    </script>
                    <h1 class="hero-name">Josh Hejka</h1>
                    <p class="hero-description">Professional pitcher in the Marlins organization. Former member of the Mets, Phillies, and Rangers. Current R&D analyst at Driveline Baseball.</p>
                    <!-- Social links populated by JS -->
                    <div class="social-links"></div>
                </div>
                <!-- Before/After comparison images - populated from evolution.json -->
                <div class="hero-comparison"></div>

                <!-- Page title - clickable to scroll to first section -->
                <a href="#year-2026" class="evolution-page-title">
                    <span class="evolution-page-title-text">
                        <span class="evolution-page-title-prefix">scroll to see my</span>
                        <h2 id="evolution-hero-title"></h2>
                    </span>
                    <span class="evolution-page-title-arrow"></span>
                </a>
            </div>
        </section>
        <!-- Sections populated directly into main, like homepage -->
    </main>
    <footer></footer>
    <script defer src="script.js"></script>
</body>
</html>
