name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Build JS and CSS (needed for E2E tests)
        run: npm run build

      - name: Run Python unit tests
        run: uv run pytest tests/python -v

      - name: Run JS unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --group build

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Build JS and CSS
        run: npm run build

      - name: Generate Resume PDF
        run: uv run python tools/generate_resume_pdf.py

      - name: Process Career Stats
        run: uv run python tools/process_stats.py

      - name: Generate OG Image
        run: uv run python tools/generate_og_image.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
