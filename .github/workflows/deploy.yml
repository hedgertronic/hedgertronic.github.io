name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install fpdf2 playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Build CSS
        run: cat css/base.css css/layout.css css/components.css css/sections.css > styles.css

      - name: Generate Resume PDF
        run: python tools/generate_resume_pdf.py

      - name: Process Career Stats
        run: python tools/process_stats.py

      - name: Generate OG Image
        run: python tools/generate_og_image.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
