name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Build JS and CSS (needed for E2E tests)
        run: npm run build

      - name: Run Python unit tests
        run: uv run pytest tests/python -v

      - name: Run JS unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --group build

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Build JS and CSS
        run: npm run build

      - name: Generate Resume PDF
        run: uv run python tools/generate_resume_pdf.py

      - name: Process Career Stats
        run: uv run python tools/process_stats.py

      - name: Generate OG Image
        run: uv run python tools/generate_og_image.py

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html CNAME robots.txt sitemap.xml styles.css script.js script.js.map _site/
          cp -R .well-known _site/
          cp -R resume _site/
          cp -R evolution _site/
          cp -R css _site/
          cp -R data _site/
          cp -R assets _site/

      - name: Check references
        run: |
          python3 - << 'PYEOF'
          import re, sys
          from pathlib import Path

          SITE_DIR = Path("_site")

          # HTML: match href="/..." and src="/..." attribute values (skip protocol-relative //)
          HTML_RE = re.compile(
              r'(?:href|src)=["\']'
              r'(/(?!/)[^"\'?#\s]*)'
              r'(?:[?#][^"\']*)?["\']'
          )

          # JS: match static string literals like "/assets/...", "/data/...", "/css/..."
          # Only checks simple literals — dynamic concatenations are not resolved
          JS_RE = re.compile(
              r'["\']'
              r'(/(?:assets|data|css|styles\.css|script\.js)[^"\'?#\s]*)'
              r'(?:[?#][^"\']*)?["\']'
          )

          errors = []

          html_files = list(SITE_DIR.glob("**/*.html"))
          if not html_files:
              print("ERROR: No HTML files found in _site", file=sys.stderr)
              sys.exit(1)

          for html_file in html_files:
              content = html_file.read_text(errors="replace")
              for m in HTML_RE.finditer(content):
                  path = m.group(1)
                  target = SITE_DIR / path.lstrip("/")
                  if not target.exists():
                      errors.append(f"  {html_file.relative_to(SITE_DIR)}: missing {path}")

          js_files = list(SITE_DIR.glob("**/*.js"))
          for js_file in js_files:
              content = js_file.read_text(errors="replace")
              for m in JS_RE.finditer(content):
                  path = m.group(1)
                  target = SITE_DIR / path.lstrip("/")
                  if not target.exists():
                      errors.append(f"  {js_file.relative_to(SITE_DIR)}: missing {path}")

          if errors:
              print(f"Reference check FAILED — {len(errors)} missing file(s):")
              for e in errors:
                  print(e)
              sys.exit(1)
          print(f"Reference check OK — {len(html_files)} HTML + {len(js_files)} JS file(s), no missing local paths.")
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
