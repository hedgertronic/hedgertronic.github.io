[project]
name = "hedgertronic.com"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fpdf2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
build = [
    "playwright>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
